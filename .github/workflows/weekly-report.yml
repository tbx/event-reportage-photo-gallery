name: Weekly report

# For your own installation: triggers the statistics mail every Monday 06:00 UTC (GitHub runs schedules with a few
# minutes of delay). Needs the repository variable STATS_URL (e.g. https://example.com/gallery/stats.php) and the
# secret STATS_KEY (from _auth.php). Uncomment the schedule block to activate it; here it only runs by hand.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * 1'

jobs:
  mail:
    # Skipped until the repository variable STATS_URL is set
    if: vars.STATS_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Call stats.php?mail=1
        run: |
          out=$(curl -fsS --max-time 60 "${{ vars.STATS_URL }}?mail=1&key=${{ secrets.STATS_KEY }}")
          echo "$out"
          case "$out" in "Mail sent"*) ;; *) exit 1;; esac
